name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers
        run: |
          echo "Contenu du dépôt :"
          ls -la
          echo "Recherche du projet Android..."
          find . -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print